services:
  sqlserver: # compose up 2
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserverdata:/var/opt/mssql
    networks:
      - airflow_network

  postgres_source:
    image: postgres:13
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: airflow           # Airflow metadata database
    ports:
      - "5432:5432"
    volumes:
      - postgres_source_data:/var/lib/postgresql/data
    networks:
      - airflow_network

  init-airflow: # compose up 1
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      - postgres_source
    restart: "no"
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://myuser:mypassword@postgres_source/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    volumes:
      - ./airflow:/opt/airflow
      - .:/opt/airflow/project
    networks:
      - airflow_network
    command: >
      bash -c "
      sleep 10 &&
      rm -f /opt/airflow/airflow-webserver.pid &&
      airflow db init &&
      (airflow users create --username airflow --password password --firstname John --lastname Doe --role Admin --email admin@example.com || echo 'user already exists, skip') &&
      (airflow connections add 'mssql_stockdb' --conn-type 'mssql' --conn-host 'sqlserver' --conn-schema 'StockMarketDataDB' --conn-login 'sa' --conn-password '${MSSQL_SA_PASSWORD}' --conn-port 1433 || echo 'connection already exists, skip')
      "

  webserver: # compose up 2
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      init-airflow:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://myuser:mypassword@postgres_source/airflow
      - AIRFLOW__WEBSERVER__SECRET_KEY=secret
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    volumes:
      - ./airflow:/opt/airflow
      - .:/opt/airflow/project
    ports:
      - "8080:8080"
    networks:
      - airflow_network
    command: webserver

  scheduler: # compose up 2
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      init-airflow:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://myuser:mypassword@postgres_source/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL=30 # Update DAGs every 30 seconds
    volumes:
      - ./airflow:/opt/airflow
      - .:/opt/airflow/project
    networks:
      - airflow_network
    command: scheduler

volumes:
  sqlserverdata:
  postgres_source_data:

networks:
  airflow_network:
    driver: bridge